name: Verify BendCAD kernel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Build bend from the BEND_PIN fork commit
        run: |
          PIN_COMMIT="$(cut -d@ -f2 BEND_PIN)"
          test -n "$PIN_COMMIT"
          git init fork-bend
          cd fork-bend
          git remote add origin https://github.com/jnadeau207-collab/bend
          git fetch --depth 1 origin "$PIN_COMMIT"
          git checkout "$PIN_COMMIT"
          git rev-parse HEAD
          export PATH="$HOME/.bun/bin:$PATH"
          mkdir -p "$HOME/.bend/bin"
          bun build --compile --target=bun-linux-x64 ./bend2/main.ts --outfile "$HOME/.bend/bin/bend"
          rm -rf "$HOME/.bend/bend2" "$HOME/.bend/guide"
          cp -r bend2 "$HOME/.bend/bend2"
          cp -r guide "$HOME/.bend/guide"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Static gates (check-only)
        run: |
          export PATH="$HOME/.bend/bin:$HOME/.bun/bin:$PATH"
          for f in src/base/ex.bend src/base/par.bend \
              src/c00/types.bend src/c00/eval.bend \
              src/c01/types.bend src/c01/ops.bend \
              src/c02/types.bend src/c02/ops.bend \
              src/c03/types.bend src/c03/ops.bend \
              src/c04/types.bend src/c04/ops.bend \
              src/c05/exact.bend src/c05/arrange.bend \
              src/c05/sqr.bend src/c05/solve.bend \
              src/c06/types.bend src/c06/surfx.bend \
              src/c06/ops.bend src/c06/eval.bend \
              tests/c00/check.bend tests/c01/check.bend \
              tests/c02/check.bend tests/c03/check.bend \
              tests/c04/check.bend tests/c05/check.bend; do
            bend "$f" --check-only
          done
      - name: Bend-native static greps (BN-2/3/4/5)
        run: |
          test -z "$(grep -rn '@unsafe' src/ laws/ tests/ | grep -v ': *#' || true)"
          test -z "$(grep -rni 'foreign\|ffi_import\|@ffi' src/ || true)"
          test -z "$(grep -rni 'occt\|freecad\|planegcs' src/ || true)"
          ! grep -rn 'F32' src/ laws/ tests/
      - name: Suites, three lanes
        run: |
          export PATH="$HOME/.bend/bin:$HOME/.bun/bin:$PATH"
          run_lane() {
            out="$1"; shift
            "$@" | tee "$out"
            grep -q 'selfcheck fails=0' "$out"
            ! grep -q 'FAIL' "$out"
          }
          mkdir -p /tmp/bendcad-ci
          run_lane /tmp/bendcad-ci/c00-neg-i.log bend tests/c00/neg.bend
          run_lane /tmp/bendcad-ci/c00-pos-i.log bend tests/c00/positive.bend
          run_lane /tmp/bendcad-ci/c01-neg-i.log bend tests/c01/neg.bend
          run_lane /tmp/bendcad-ci/c01-pos-i.log bend tests/c01/pos.bend
          run_lane /tmp/bendcad-ci/c02-neg-i.log bend tests/c02/neg.bend
          run_lane /tmp/bendcad-ci/c02-pos-i.log bend tests/c02/pos.bend
          run_lane /tmp/bendcad-ci/c03-neg-i.log bend tests/c03/neg.bend
          run_lane /tmp/bendcad-ci/c03-pos-i.log bend tests/c03/pos.bend
          run_lane /tmp/bendcad-ci/c04-neg-i.log bend tests/c04/neg.bend
          run_lane /tmp/bendcad-ci/c04-pos-i.log bend tests/c04/pos.bend
          run_lane /tmp/bendcad-ci/c05-neg-i.log bend tests/c05/neg.bend
          run_lane /tmp/bendcad-ci/c05-pos-i.log bend tests/c05/pos.bend
          run_lane /tmp/bendcad-ci/c06-box-i.log bend tests/c06/box.bend
          run_lane /tmp/bendcad-ci/c06-diag-i.log bend tests/c06/diag.bend
          run_lane /tmp/bendcad-ci/c06-eval-i.log bend tests/c06/eval.bend
          bend tests/c00/neg.bend -o /tmp/bendcad-ci/c00-neg-n
          run_lane /tmp/bendcad-ci/c00-neg-n.log /tmp/bendcad-ci/c00-neg-n
          bend tests/c00/positive.bend -o /tmp/bendcad-ci/c00-pos-n
          run_lane /tmp/bendcad-ci/c00-pos-n.log /tmp/bendcad-ci/c00-pos-n
          bend tests/c01/neg.bend -o /tmp/bendcad-ci/c01-neg-n
          run_lane /tmp/bendcad-ci/c01-neg-n.log /tmp/bendcad-ci/c01-neg-n
          bend tests/c01/pos.bend -o /tmp/bendcad-ci/c01-pos-n
          run_lane /tmp/bendcad-ci/c01-pos-n.log /tmp/bendcad-ci/c01-pos-n
          bend tests/c02/neg.bend -o /tmp/bendcad-ci/c02-neg-n
          run_lane /tmp/bendcad-ci/c02-neg-n.log /tmp/bendcad-ci/c02-neg-n
          bend tests/c02/pos.bend -o /tmp/bendcad-ci/c02-pos-n
          run_lane /tmp/bendcad-ci/c02-pos-n.log /tmp/bendcad-ci/c02-pos-n
          bend tests/c03/neg.bend -o /tmp/bendcad-ci/c03-neg-n
          run_lane /tmp/bendcad-ci/c03-neg-n.log /tmp/bendcad-ci/c03-neg-n
          bend tests/c03/pos.bend -o /tmp/bendcad-ci/c03-pos-n
          run_lane /tmp/bendcad-ci/c03-pos-n.log /tmp/bendcad-ci/c03-pos-n
          bend tests/c04/neg.bend -o /tmp/bendcad-ci/c04-neg-n
          run_lane /tmp/bendcad-ci/c04-neg-n.log /tmp/bendcad-ci/c04-neg-n
          bend tests/c04/pos.bend -o /tmp/bendcad-ci/c04-pos-n
          run_lane /tmp/bendcad-ci/c04-pos-n.log /tmp/bendcad-ci/c04-pos-n
          bend tests/c05/neg.bend -o /tmp/bendcad-ci/c05-neg-n
          run_lane /tmp/bendcad-ci/c05-neg-n.log /tmp/bendcad-ci/c05-neg-n
          bend tests/c05/pos.bend -o /tmp/bendcad-ci/c05-pos-n
          run_lane /tmp/bendcad-ci/c05-pos-n.log /tmp/bendcad-ci/c05-pos-n
          bend tests/c06/box.bend -o /tmp/bendcad-ci/c06-box-n
          run_lane /tmp/bendcad-ci/c06-box-n.log /tmp/bendcad-ci/c06-box-n
          bend tests/c06/diag.bend -o /tmp/bendcad-ci/c06-diag-n
          run_lane /tmp/bendcad-ci/c06-diag-n.log /tmp/bendcad-ci/c06-diag-n
          bend tests/c06/eval.bend -o /tmp/bendcad-ci/c06-eval-n
          run_lane /tmp/bendcad-ci/c06-eval-n.log /tmp/bendcad-ci/c06-eval-n
          bend tests/c00/neg.bend -o /tmp/bendcad-ci/c00-neg.js
          run_lane /tmp/bendcad-ci/c00-neg-js.log bun /tmp/bendcad-ci/c00-neg.js
          bend tests/c00/positive.bend -o /tmp/bendcad-ci/c00-pos.js
          run_lane /tmp/bendcad-ci/c00-pos-js.log bun /tmp/bendcad-ci/c00-pos.js
          bend tests/c01/neg.bend -o /tmp/bendcad-ci/c01-neg.js
          run_lane /tmp/bendcad-ci/c01-neg-js.log bun /tmp/bendcad-ci/c01-neg.js
          bend tests/c01/pos.bend -o /tmp/bendcad-ci/c01-pos.js
          run_lane /tmp/bendcad-ci/c01-pos-js.log bun /tmp/bendcad-ci/c01-pos.js
          bend tests/c02/neg.bend -o /tmp/bendcad-ci/c02-neg.js
          run_lane /tmp/bendcad-ci/c02-neg-js.log bun /tmp/bendcad-ci/c02-neg.js
          bend tests/c02/pos.bend -o /tmp/bendcad-ci/c02-pos.js
          run_lane /tmp/bendcad-ci/c02-pos-js.log bun /tmp/bendcad-ci/c02-pos.js
          bend tests/c03/neg.bend -o /tmp/bendcad-ci/c03-neg.js
          run_lane /tmp/bendcad-ci/c03-neg-js.log bun /tmp/bendcad-ci/c03-neg.js
          bend tests/c03/pos.bend -o /tmp/bendcad-ci/c03-pos.js
          run_lane /tmp/bendcad-ci/c03-pos-js.log bun /tmp/bendcad-ci/c03-pos.js
          bend tests/c04/neg.bend -o /tmp/bendcad-ci/c04-neg.js
          run_lane /tmp/bendcad-ci/c04-neg-js.log bun /tmp/bendcad-ci/c04-neg.js
          bend tests/c04/pos.bend -o /tmp/bendcad-ci/c04-pos.js
          run_lane /tmp/bendcad-ci/c04-pos-js.log bun /tmp/bendcad-ci/c04-pos.js
          bend tests/c05/neg.bend -o /tmp/bendcad-ci/c05-neg.js
          run_lane /tmp/bendcad-ci/c05-neg-js.log bun /tmp/bendcad-ci/c05-neg.js
          bend tests/c05/pos.bend -o /tmp/bendcad-ci/c05-pos.js
          run_lane /tmp/bendcad-ci/c05-pos-js.log bun /tmp/bendcad-ci/c05-pos.js
          bend tests/c06/box.bend -o /tmp/bendcad-ci/c06-box.js
          run_lane /tmp/bendcad-ci/c06-box-js.log bun /tmp/bendcad-ci/c06-box.js
          bend tests/c06/diag.bend -o /tmp/bendcad-ci/c06-diag.js
          run_lane /tmp/bendcad-ci/c06-diag-js.log bun /tmp/bendcad-ci/c06-diag.js
          bend tests/c06/eval.bend -o /tmp/bendcad-ci/c06-eval.js
          run_lane /tmp/bendcad-ci/c06-eval-js.log bun /tmp/bendcad-ci/c06-eval.js
          cmp /tmp/bendcad-ci/c00-neg-i.log /tmp/bendcad-ci/c00-neg-n.log
          cmp /tmp/bendcad-ci/c00-neg-i.log /tmp/bendcad-ci/c00-neg-js.log
          cmp /tmp/bendcad-ci/c00-pos-i.log /tmp/bendcad-ci/c00-pos-n.log
          cmp /tmp/bendcad-ci/c00-pos-i.log /tmp/bendcad-ci/c00-pos-js.log
          cmp /tmp/bendcad-ci/c01-neg-i.log /tmp/bendcad-ci/c01-neg-n.log
          cmp /tmp/bendcad-ci/c01-neg-i.log /tmp/bendcad-ci/c01-neg-js.log
          cmp /tmp/bendcad-ci/c01-pos-i.log /tmp/bendcad-ci/c01-pos-n.log
          cmp /tmp/bendcad-ci/c01-pos-i.log /tmp/bendcad-ci/c01-pos-js.log
          cmp /tmp/bendcad-ci/c02-neg-i.log /tmp/bendcad-ci/c02-neg-n.log
          cmp /tmp/bendcad-ci/c02-neg-i.log /tmp/bendcad-ci/c02-neg-js.log
          cmp /tmp/bendcad-ci/c02-pos-i.log /tmp/bendcad-ci/c02-pos-n.log
          cmp /tmp/bendcad-ci/c02-pos-i.log /tmp/bendcad-ci/c02-pos-js.log
          cmp /tmp/bendcad-ci/c03-neg-i.log /tmp/bendcad-ci/c03-neg-n.log
          cmp /tmp/bendcad-ci/c03-neg-i.log /tmp/bendcad-ci/c03-neg-js.log
          cmp /tmp/bendcad-ci/c03-pos-i.log /tmp/bendcad-ci/c03-pos-n.log
          cmp /tmp/bendcad-ci/c03-pos-i.log /tmp/bendcad-ci/c03-pos-js.log
          cmp /tmp/bendcad-ci/c04-neg-i.log /tmp/bendcad-ci/c04-neg-n.log
          cmp /tmp/bendcad-ci/c04-neg-i.log /tmp/bendcad-ci/c04-neg-js.log
          cmp /tmp/bendcad-ci/c04-pos-i.log /tmp/bendcad-ci/c04-pos-n.log
          cmp /tmp/bendcad-ci/c04-pos-i.log /tmp/bendcad-ci/c04-pos-js.log
          cmp /tmp/bendcad-ci/c05-neg-i.log /tmp/bendcad-ci/c05-neg-n.log
          cmp /tmp/bendcad-ci/c05-neg-i.log /tmp/bendcad-ci/c05-neg-js.log
          cmp /tmp/bendcad-ci/c05-pos-i.log /tmp/bendcad-ci/c05-pos-n.log
          cmp /tmp/bendcad-ci/c05-pos-i.log /tmp/bendcad-ci/c05-pos-js.log
          cmp /tmp/bendcad-ci/c06-box-i.log /tmp/bendcad-ci/c06-box-n.log
          cmp /tmp/bendcad-ci/c06-box-i.log /tmp/bendcad-ci/c06-box-js.log
          cmp /tmp/bendcad-ci/c06-diag-i.log /tmp/bendcad-ci/c06-diag-n.log
          cmp /tmp/bendcad-ci/c06-diag-i.log /tmp/bendcad-ci/c06-diag-js.log
          cmp /tmp/bendcad-ci/c06-eval-i.log /tmp/bendcad-ci/c06-eval-n.log
          cmp /tmp/bendcad-ci/c06-eval-i.log /tmp/bendcad-ci/c06-eval-js.log
      - name: C05 independent oracles
        run: |
          export PATH="$HOME/.bend/bin:$HOME/.bun/bin:$PATH"
          python3 -m pip install --quiet --break-system-packages numpy scipy shapely
          python3 tools/oracle/c05/oracles.py | tee /tmp/bendcad-ci/c05-oracles.log
          test "$(grep -c cases /tmp/bendcad-ci/c05-oracles.log)" = 13
          ! grep -E 'wrong=[1-9]|mismatches=[1-9]' /tmp/bendcad-ci/c05-oracles.log
  laws:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        law: [c00, c01, c02, c03, c04, c05, c06]
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Build bend from the BEND_PIN fork commit
        run: |
          PIN_COMMIT="$(cut -d@ -f2 BEND_PIN)"
          test -n "$PIN_COMMIT"
          git init fork-bend
          cd fork-bend
          git remote add origin https://github.com/jnadeau207-collab/bend
          git fetch --depth 1 origin "$PIN_COMMIT"
          git checkout "$PIN_COMMIT"
          git rev-parse HEAD
          export PATH="$HOME/.bun/bin:$PATH"
          mkdir -p "$HOME/.bend/bin"
          bun build --compile --target=bun-linux-x64 ./bend2/main.ts --outfile "$HOME/.bend/bin/bend"
          rm -rf "$HOME/.bend/bend2" "$HOME/.bend/guide"
          cp -r bend2 "$HOME/.bend/bend2"
          cp -r guide "$HOME/.bend/guide"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Check the law file in full
        run: |
          export PATH="$HOME/.bend/bin:$HOME/.bun/bin:$PATH"
          bend "laws/${{ matrix.law }}.bend" --check-only
