name: Finish authenticated legacy recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/finish-legacy-transfer.yml]
permissions:
  contents: write
concurrency:
  group: legacy-recovery-transfer
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Receive encrypted, hash-pinned source downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, pathlib, re, subprocess, tempfile, time, urllib.parse, urllib.request, zlib
          root = pathlib.Path.cwd()
          queue = root / '.recovery-transfer'
          queue.mkdir(exist_ok=True)
          work = pathlib.Path(tempfile.mkdtemp(prefix='bendcad-recovery-'))
          private = work / 'private.pem'
          public = queue / 'public.pem'
          def cmd(*args, data=None):
              return subprocess.run(args, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True).stdout
          def git(*args):
              return cmd('git', *args).decode().strip()
          git('config', 'user.name', 'BendCAD Recovery')
          git('config', 'user.email', 'actions@users.noreply.github.com')
          cmd('openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:3072', '-out', str(private))
          os.chmod(private, 0o600)
          public.write_bytes(cmd('openssl', 'pkey', '-in', str(private), '-pubout'))
          git('add', '--', '.recovery-transfer/public.pem')
          git('commit', '-m', 'chore: publish ephemeral recovery encryption public key')
          git('push', 'origin', 'HEAD:main')
          done = set()
          deadline = time.monotonic() + 1320
          while time.monotonic() < deadline:
              git('fetch', 'origin', 'main')
              git('merge', '--ff-only', 'FETCH_HEAD')
              if (queue / 'FINISH').exists():
                  print('Recovery transfer closed after', len(done), 'verified batches.', flush=True)
                  break
              for batch in sorted(queue.glob('batch-*.json')):
                  if batch.name in done:
                      continue
                  packet = json.loads(batch.read_text())
                  wrapped, iv, ciphertext, mac = [base64.b64decode(packet[k], validate=True) for k in ('key', 'iv', 'data', 'mac')]
                  key = cmd('openssl', 'pkeyutl', '-decrypt', '-inkey', str(private), '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256', data=wrapped)
                  if len(key) != 64 or len(iv) != 16 or not hmac.compare_digest(mac, hmac.new(key[32:], wrapped + iv + ciphertext, hashlib.sha256).digest()):
                      raise RuntimeError('Encrypted transfer authentication failed')
                  compressed = cmd('openssl', 'enc', '-d', '-aes-256-ctr', '-K', key[:32].hex(), '-iv', iv.hex(), data=ciphertext)
                  rows = json.loads(zlib.decompress(compressed))
                  if not isinstance(rows, list) or len(rows) > 300:
                      raise RuntimeError('Invalid transfer batch')
                  for row in rows:
                      p = pathlib.PurePosixPath(row['path'])
                      if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] == '.git':
                          raise RuntimeError('Unsafe archive path')
                      if not re.fullmatch('[0-9a-f]{40}', row['sha']):
                          raise RuntimeError('Invalid pinned blob hash')
                      url = row['url']
                      parsed = urllib.parse.urlsplit(url)
                      expected_path = '/jnadeau207-collab/reepo/eeca9ad782640f97bc15423e72319acea310d36f/' + str(p)
                      if parsed.scheme != 'https' or parsed.netloc != 'raw.githubusercontent.com' or urllib.parse.unquote(parsed.path) != expected_path:
                          raise RuntimeError('Unapproved source URL')
                      for value in urllib.parse.parse_qs(parsed.query).get('token', []):
                          print('::add-mask::' + value, flush=True)
                      destination = root / 'legacy' / 'aethalgard' / p
                      if destination.exists() and hashlib.sha1(b'blob ' + str(destination.stat().st_size).encode() + b'\0' + destination.read_bytes()).hexdigest() == row['sha']:
                          continue
                      try:
                          with urllib.request.urlopen(url, timeout=45) as response:
                              data = response.read(20 * 1024 * 1024 + 1)
                      except Exception:
                          raise RuntimeError('Source download failed for ' + str(p)) from None
                      actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                      if len(data) > 20 * 1024 * 1024 or actual != row['sha']:
                          raise RuntimeError('Source hash mismatch for ' + str(p))
                      if destination.is_symlink():
                          raise RuntimeError('Refusing symlink overwrite')
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(data)
                      os.chmod(destination, 0o755 if row.get('mode') == '100755' else 0o644)
                  git('add', '--', 'legacy/aethalgard')
                  changed = bool(git('diff', '--cached', '--name-only'))
                  if changed:
                      git('commit', '-m', 'archive: recover hash-verified legacy files ' + batch.stem)
                      git('push', 'origin', 'HEAD:main')
                  done.add(batch.name)
                  print(batch.name, ':', len(rows), 'source blobs verified; committed:', changed, flush=True)
              time.sleep(5)
          else:
              raise RuntimeError('Recovery transfer deadline reached; completed batches remain committed')
          private.unlink(missing_ok=True)
          PY
